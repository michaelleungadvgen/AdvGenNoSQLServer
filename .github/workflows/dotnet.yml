# This workflow builds and tests the server-path projects on Linux.
# Note: the full solution cannot build on Linux because it includes the
# net9.0-windows WPF example — CI builds the server projects explicitly.

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore
      run: |
        dotnet restore AdvGenNoSqlServer.Host/AdvGenNoSqlServer.Host.csproj
        dotnet restore AdvGenNoSqlServer.Server/AdvGenNoSqlServer.Server.csproj
        dotnet restore AdvGenNoSqlServer.Tests/AdvGenNoSqlServer.Tests.csproj
        dotnet restore AdvGenNoSqlServer.Embedded.Tests/AdvGenNoSqlServer.Embedded.Tests.csproj

    - name: Build (server path)
      run: |
        dotnet build AdvGenNoSqlServer.Host/AdvGenNoSqlServer.Host.csproj -c Release --no-restore
        dotnet build AdvGenNoSqlServer.Server/AdvGenNoSqlServer.Server.csproj -c Release --no-restore
        dotnet build AdvGenNoSqlServer.Tests/AdvGenNoSqlServer.Tests.csproj -c Release --no-restore
        dotnet build AdvGenNoSqlServer.Embedded.Tests/AdvGenNoSqlServer.Embedded.Tests.csproj -c Release --no-restore

    - name: Test (main suite)
      run: dotnet test AdvGenNoSqlServer.Tests/AdvGenNoSqlServer.Tests.csproj -c Release --no-build --verbosity normal

    - name: Test (embedded suite)
      run: dotnet test AdvGenNoSqlServer.Embedded.Tests/AdvGenNoSqlServer.Embedded.Tests.csproj -c Release --no-build --verbosity normal
